<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura conceitual de RAG, busca vetorial e fine-tuning</title>
  <desc id="desc">Documentos são indexados em uma base vetorial, recuperados para uma resposta com fontes, enquanto exemplos avaliados alimentam um fluxo separado de fine-tuning.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a22"/>
      <stop offset=".55" stop-color="#111721"/>
      <stop offset="1" stop-color="#1b1525"/>
    </linearGradient>
    <linearGradient id="vector-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20323d"/>
      <stop offset="1" stop-color="#1c2531"/>
    </linearGradient>
    <linearGradient id="answer-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#202b31"/>
      <stop offset="1" stop-color="#1d2530"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#73e2d0" stop-opacity=".22"/>
      <stop offset="1" stop-color="#73e2d0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#b8d5e0" stroke-opacity=".07"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#78dbcd"/>
    </marker>
    <style>
      .label{font:600 12px Consolas,'Courier New',monospace;letter-spacing:1.4px;fill:#9fb9c4}
      .title{font:700 15px Consolas,'Courier New',monospace;fill:#ecf7f6}
      .small{font:11px Consolas,'Courier New',monospace;fill:#a8bdc6}
      .tiny{font:10px Consolas,'Courier New',monospace;fill:#8ba5b1}
      .mint{fill:#83e6d3}.violet{fill:#c5aaf3}
    </style>
  </defs>
  <rect width="800" height="480" fill="url(#background)"/>
  <rect width="800" height="480" fill="url(#grid)"/>
  <ellipse cx="389" cy="216" rx="270" ry="180" fill="url(#halo)"/>
  <circle cx="746" cy="45" r="85" fill="#ad8cde" opacity=".055"/>

  <path d="M205 184h28m253 0h27" fill="none" stroke="#78dbcd" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <path d="M103 317v18m590-18v18" fill="none" stroke="#89aabd" stroke-opacity=".48" stroke-dasharray="3 4"/>

  <g transform="translate(34 75)">
    <rect width="171" height="242" rx="5" fill="#18242c" stroke="#557281"/>
    <rect width="171" height="31" rx="5" fill="#23343d"/>
    <circle cx="16" cy="16" r="3" fill="#84dfc9"/>
    <text x="29" y="21" class="label">01 / FONTES</text>
    <text x="15" y="56" class="title">Conhecimento</text>
    <text x="15" y="73" class="tiny">dados autorizados</text>
    <g transform="translate(14 91)">
      <rect width="142" height="38" rx="3" fill="#26333d" stroke="#3b5966"/>
      <path d="M12 10h13l5 5v13H12Z M25 10v5h5" fill="none" stroke="#80dfd0" stroke-width="1.5"/>
      <text x="41" y="17" class="small">Manuais</text><text x="41" y="30" class="tiny">PDF · 128 páginas</text>
    </g>
    <g transform="translate(14 139)">
      <rect width="142" height="38" rx="3" fill="#26333d" stroke="#3b5966"/>
      <path d="M12 10h13l5 5v13H12Z M25 10v5h5" fill="none" stroke="#80dfd0" stroke-width="1.5"/>
      <text x="41" y="17" class="small">Procedimentos</text><text x="41" y="30" class="tiny">WIKI · versão 03</text>
    </g>
    <g transform="translate(14 187)">
      <rect width="142" height="38" rx="3" fill="#26333d" stroke="#3b5966"/>
      <path d="M12 10h13l5 5v13H12Z M25 10v5h5" fill="none" stroke="#80dfd0" stroke-width="1.5"/>
      <text x="41" y="17" class="small">Registros</text><text x="41" y="30" class="tiny">CRM · acesso OK</text>
    </g>
  </g>

  <g transform="translate(238 75)">
    <rect width="248" height="242" rx="5" fill="url(#vector-panel)" stroke="#638e93"/>
    <rect width="248" height="31" rx="5" fill="#2a444a"/>
    <circle cx="17" cy="16" r="3" fill="#84dfc9"/>
    <text x="30" y="21" class="label">02 / ÍNDICE VETORIAL</text>
    <text x="16" y="56" class="title">Busca por significado</text>
    <text x="16" y="73" class="tiny">trechos + embeddings + filtros</text>
    <rect x="15" y="84" width="218" height="120" rx="3" fill="#172c34" stroke="#3a626a"/>
    <path d="M28 183h190M28 155h190M28 127h190M60 95v98M106 95v98M152 95v98M198 95v98" stroke="#a5d4d6" stroke-opacity=".10"/>
    <ellipse cx="151" cy="137" rx="44" ry="34" fill="#79e4d1" opacity=".07" stroke="#85ecdb" stroke-opacity=".5" stroke-dasharray="4 4"/>
    <g fill="#76a9ba">
      <circle cx="46" cy="112" r="3"/><circle cx="71" cy="165" r="3"/><circle cx="90" cy="119" r="3"/>
      <circle cx="102" cy="180" r="3"/><circle cx="192" cy="110" r="3"/><circle cx="210" cy="170" r="3"/>
    </g>
    <g fill="#a7a1d7">
      <circle cx="86" cy="144" r="4"/><circle cx="187" cy="181" r="4"/><circle cx="72" cy="103" r="3"/>
    </g>
    <g fill="#8fe9d7" filter="url(#glow)">
      <circle cx="125" cy="127" r="4"/><circle cx="143" cy="147" r="5"/><circle cx="166" cy="119" r="4"/>
      <circle cx="174" cy="145" r="4"/><circle cx="153" cy="132" r="6"/>
    </g>
    <path d="M125 127l28 5 13-13m-13 13-10 15 31-2" stroke="#80dacc" stroke-opacity=".55" fill="none"/>
    <rect x="16" y="214" width="126" height="17" rx="3" fill="#2d5554"/>
    <text x="23" y="226" class="tiny mint">MATCH 0.91 · TRECHO 04</text>
    <text x="155" y="226" class="tiny">top-k / filtros</text>
  </g>

  <g transform="translate(519 75)">
    <rect width="247" height="242" rx="5" fill="url(#answer-panel)" stroke="#718491"/>
    <rect width="247" height="31" rx="5" fill="#303d48"/>
    <circle cx="17" cy="16" r="3" fill="#c2a5ed"/>
    <text x="30" y="21" class="label">03 / RAG</text>
    <text x="16" y="56" class="title">Resposta com contexto</text>
    <rect x="15" y="72" width="217" height="44" rx="3" fill="#273946" stroke="#4d6979"/>
    <text x="26" y="91" class="tiny violet">PERGUNTA</text>
    <text x="26" y="106" class="small">Como funciona a expedição?</text>
    <rect x="15" y="127" width="217" height="79" rx="3" fill="#1b3439" stroke="#4b817f"/>
    <text x="26" y="145" class="tiny mint">RESPOSTA GERADA</text>
    <rect x="26" y="155" width="182" height="3" rx="1.5" fill="#b4d6d1" opacity=".75"/>
    <rect x="26" y="166" width="169" height="3" rx="1.5" fill="#b4d6d1" opacity=".6"/>
    <rect x="26" y="177" width="178" height="3" rx="1.5" fill="#b4d6d1" opacity=".5"/>
    <rect x="26" y="188" width="105" height="3" rx="1.5" fill="#b4d6d1" opacity=".4"/>
    <rect x="15" y="215" width="217" height="17" rx="3" fill="#344d50"/>
    <text x="23" y="227" class="tiny mint">↗ FONTE: procedimento / v03</text>
  </g>

  <g transform="translate(34 342)">
    <rect width="732" height="102" rx="5" fill="#211d2d" stroke="#806b9a"/>
    <rect width="4" height="102" rx="2" fill="#c0a3ee"/>
    <text x="19" y="25" class="label violet">TRILHA COMPLEMENTAR / FINE-TUNING</text>
    <text x="19" y="45" class="small">Exemplos curados ajustam uma tarefa ou um formato recorrente</text>
    <g transform="translate(19 60)">
      <rect width="176" height="28" rx="3" fill="#322a42" stroke="#655378"/>
      <text x="12" y="19" class="small">01  EXEMPLOS</text>
      <path d="M182 14h34" stroke="#c3a8ed" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="222" width="176" height="28" rx="3" fill="#322a42" stroke="#655378"/>
      <text x="234" y="19" class="small">02  AJUSTE</text>
      <path d="M404 14h34" stroke="#c3a8ed" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="444" width="245" height="28" rx="3" fill="#322a42" stroke="#655378"/>
      <text x="456" y="19" class="small">03  TESTE + RESULTADO</text>
    </g>
  </g>
  <text x="36" y="467" class="tiny">ARQUITETURA CONCEITUAL · FONTES E PERMISSÕES DEFINIDAS POR PROJETO</text>
  <text x="744" y="467" text-anchor="end" class="tiny">TH / AI LAB</text>
</svg>
